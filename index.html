    let payment = paymentStore[key] || adminPayments.find(p => normalizePaymentDate(p.date) === normalizePaymentDate(x[0]) && String(p.amount).trim() === String(x[1]).trim());

    if (!imgSrc) {

  }

  document.getElementById("history").innerHTML=rows;
}

const RECEIPT_DB = "VinayagarSeettuReceipts";
const RECEIPT_STORE = "screenshots";
const paymentStore = {};
function paymentKey(name,date,amount){ return String(name)+"|"+normalizePaymentDate(date)+"|"+String(amount).trim(); }
function openReceiptDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB unavailable")); return; }
    const req=indexedDB.open(RECEIPT_DB,1);
    req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(RECEIPT_STORE)) req.result.createObjectStore(RECEIPT_STORE); };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("DB open failed"));
  });
}
function putReceipt(key, blob){
  return openReceiptDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(RECEIPT_STORE,"readwrite");
    tx.objectStore(RECEIPT_STORE).put(blob,key);
    tx.oncomplete=()=>{db.close();resolve(true)};
    tx.onerror=()=>{db.close();reject(tx.error||new Error("DB write failed"));};
  }));
}
function getReceipt(key){
  return openReceiptDB().then(db=>new Promise((resolve,reject)=>{
    const tx=db.transaction(RECEIPT_STORE,"readonly");
    const req=tx.objectStore(RECEIPT_STORE).get(key);
    req.onsuccess=()=>{const v=req.result; db.close(); resolve(v||null)};
    req.onerror=()=>{db.close();reject(req.error||new Error("DB read failed"));};
  }));
}
function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    if(!blob){resolve("");return;}
    if(typeof blob === "string"){resolve(blob);return;}
    const r=new FileReader(); r.onload=()=>resolve(r.result||""); r.onerror=()=>reject(r.error||new Error("read failed")); r.readAsDataURL(blob);
  });
}
function normalizePaymentDate(d){
  const v=String(d||"").trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}` : v;
}

function saveAdminPayment(){
  const name=document.getElementById("adminMember").value;
  const date=document.getElementById("adminDate").value;
  const time=document.getElementById("adminTime").value;
  const amount=document.getElementById("adminAmount").value;
  const method=document.getElementById("adminMethod").value;
  const file=document.getElementById("adminImage").files[0];
  if(!name||!date||!time||!amount||Number(amount)<=0){alert("Member, Date, Time and Amount சரியாக fill pannunga.");return;}
  if(!file){alert("Payment Screenshot select pannunga.");return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=async()=>{
      try{
        const max=1400;
        const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
        canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        const dataUrl=canvas.toDataURL("image/jpeg",0.82);
        const blob=await (await fetch(dataUrl)).blob();
        const key=paymentKey(name,date,amount);
        let storedInDB=false;
        try{ await putReceipt(key,blob); storedInDB=true; }catch(e){}
        const all=getAdminPayments(); if(!all[name]) all[name]=[];
        const payment={date,time,amount:String(amount),method,image:dataUrl,hasScreenshot:true};
        const idx=all[name].findIndex(p=>normalizePaymentDate(p.date)===normalizePaymentDate(date)&&String(p.amount).trim()===String(amount).trim());
        if(idx>=0) all[name][idx]=payment; else all[name].push(payment);
        localStorage.setItem("vinayagarAdminPayments",JSON.stringify(all));
        localStorage.setItem("vinayagarLastReceipt",JSON.stringify({name,date,time,amount:String(amount),method,hasScreenshot:true}));
        paymentStore[key]=payment;
        document.getElementById("adminSaved").textContent="✅ Payment + Screenshot saved.";
        document.getElementById("adminImageStatus").textContent="📷 Screenshot saved successfully";
        document.getElementById("adminImage").value="";
      }catch(e){ alert("Screenshot save ஆகவில்லை. வேறு image select pannunga."); }
    };
    img.onerror=()=>alert("Screenshot read panna mudiyala. Vera image select pannunga.");
    img.src=reader.result;
  };
  reader.onerror=()=>alert("Screenshot read panna mudiyala. Vera image select pannunga.");
  reader.readAsDataURL(file);
}
