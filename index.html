<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://zkcmciddnwzezrxfwdhw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DWFczPxPCwB3uspmud-NkA_yNF4mA5s";

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  window.supabaseClient = supabase;
  window.cloudPayments = {};
  window.supabaseReady = true;

  function displayPaymentTime(value) {
    if (!value) return "";
    // Supabase column payment_time is timestamptz, so convert it back to HH:MM for the UI.
    if (String(value).includes("T")) {
      const d = new Date(value);
      if (!Number.isNaN(d.getTime())) {
        return d.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: false });
      }
    }
    return String(value).slice(0, 5);
  }

  async function loadPayments() {
    const { data, error } = await supabase
      .from("Payments")
      .select("*")
      .order("created_at", { ascending: true });

    if (error) {
      console.error(error);
      window.supabaseErrorMessage = "❌ Supabase read failed: " + error.message;
      const saved = document.getElementById("adminSaved");
      if (saved) saved.textContent = window.supabaseErrorMessage;
      return;
    }

    const grouped = {};
    (data || []).forEach(p => {
      const member = p.member_name;
      if (!member) return;
      if (!grouped[member]) grouped[member] = [];
      grouped[member].push({
        id: p.id,
        member: p.member_name,
        date: p.payment_date || "",
        time: displayPaymentTime(p.payment_time),
        amount: String(p.payment_amount ?? ""),
        status: p.payment_status || "Paid",
        method: p.payment_method || "Online",
        image: p.payment_proof_url || ""
      });
    });

    window.cloudPayments = grouped;
    if (window.currentMember && typeof window.showMember === "function") {
      window.showMember(window.currentMember);
    }
  }

  window.savePaymentToSupabase = async function(payment, file) {
    try {
      let imageUrl = "";

      if (file) {
        const safeMember = payment.member.replace(/[^a-zA-Z0-9_-]/g, "_");
        const safeDate = payment.date.replace(/[^0-9-]/g, "_");
        const safeTime = payment.time.replace(/[^0-9-]/g, "_");
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
        const path = `${safeMember}/${safeDate}_${safeTime}_${Date.now()}.${ext}`;

        const { error: uploadError } = await supabase
          .storage
          .from("Payment history")
          .upload(path, file, { upsert: false, contentType: file.type || "image/jpeg" });

        if (uploadError) throw new Error("Screenshot upload failed: " + uploadError.message);

        const { data: publicData } = supabase
          .storage
          .from("Payment history")
          .getPublicUrl(path);

        imageUrl = publicData.publicUrl;
      }

      // payment_time in public.Payments is a timestamp with time zone (timestamptz).
      // The admin form supplies only HH:MM, so combine it with the selected date.
      const paymentTimestamp = `${payment.date}T${payment.time}:00+05:30`;

      const { data, error } = await supabase
        .from("Payments")
        .insert([{
          member_name: payment.member,
          payment_amount: Number(payment.amount),
          payment_time: paymentTimestamp,
          payment_status: "Paid",
          payment_method: payment.method,
          payment_proof_url: imageUrl,
          payment_date: payment.date
        }])
        .select()
        .single();

      if (error) throw error;

      await loadPayments();
      return { ok: true, data };
    } catch (err) {
      console.error(err);
      return { ok: false, error: err.message || String(err) };
    }
  };

  loadPayments();
</script>

  document.getElementById("adminImage").value="";
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Image read failed."));
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxSide=1000;
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        let quality=.62;
        let data=canvas.toDataURL("image/jpeg",quality);
        for(let i=0;i<6 && data.length>900000;i++){
          quality-=.07;
          data=canvas.toDataURL("image/jpeg",quality);
        }
        if(data.length>950000) reject(new Error("Screenshot romba perusa irukku. Smaller screenshot select pannunga."));
        else resolve(data);
      };
      img.onerror=()=>reject(new Error("Invalid image file."));
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

h1{text-align:center;color:#ff6f00;margin:0 0 8px}
h2{text-align:center;margin:0 0 22px;font-size:20px}
.row{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid #ddd}
.total{font-size:21px;font-weight:bold;text-align:right;margin-top:18px}
.print{display:block;width:100%;box-sizing:border-box;border:0;border-radius:10px;padding:13px;margin-top:22px;background:#2196f3;color:white;font-size:17px}
@media print{body{background:white;padding:0}.bill{box-shadow:none}.print{display:none}}
</style>
</head>
<body>
<div class="bill">
<h1>🏛️ Vinayagar Seettu</h1>
<h2>Payment Receipt</h2>
<div class="row"><b>Member</b><span>${name}</span></div>
<div class="row"><b>Mobile</b><span>${mobile}</span></div>
<div class="row"><b>Date</b><span>${date}</span></div>${receiptTime ? `<div class="row"><b>Time</b><span>${receiptTime}</span></div>` : ""}
<div class="row"><b>Amount</b><span>₹${amount}</span></div>
<div class="row"><b>Payment Method</b><span>${paymentMethod}</span></div>
<div class="row"><b>Payment Receiver</b><span>RanjithKumar</span></div>
<div class="row"><b>Status</b><span>Paid</span></div>
<div class="row"><b>Bill No.</b><span>${billNo}</span></div>
<div class="total">Paid: ₹${amount}</div>
<button class="print" onclick="window.print()">🧾 Print / Save as PDF</button>
</div>

</div>
</body>
</html>`;

  const win = window.open("", "_blank");
  if(!win){
    alert("Please allow pop-ups for this website, then tap Paid 🧾 Bill again.");
    return;
  }
  win.document.open();
  win.document.write(bill);
  win.document.close();
}
</script>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin-overlay">
  <div class="admin-box">
    <button class="admin-close" onclick="closeAdmin()">✕</button>
    <h2>🔐 Admin Payment</h2>

    <div id="adminLogin">
      <p>Admin password</p>
      <input id="adminPassword" type="password" placeholder="Password">
      <button onclick="adminLogin()">Login</button>
      <p id="adminError" class="error"></p>
    </div>

    <div id="adminForm" style="display:none">
      <label>Member</label>
      <select id="adminMember"></select>

      <label>Date</label>
      <input id="adminDate" type="date">

      <label>Time</label>
      <input id="adminTime" type="time">

      <label>Amount</label>
      <input id="adminAmount" type="number" min="0" placeholder="100">

      <label>Payment Method</label>
      <select id="adminMethod">
        <option>Online</option>
        <option>Cash</option>
      </select>

      <label>Payment Screenshot</label>
      <input id="adminImage" type="file" accept="image/*">

      <button onclick="saveAdminPayment()">💾 Save Payment</button>
      <p id="adminSaved" class="saved"></p>
    </div>
  </div>
</div>


</body>
</html>
