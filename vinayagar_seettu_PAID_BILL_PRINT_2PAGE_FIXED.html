<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://zkcmciddnwzezrxfwdhw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_DWFczPxPCwB3uspmud-NkA_yNF4mA5s";

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  window.supabaseClient = supabase;
  window.cloudPayments = {};
  window.supabaseReady = true;

  async function loadDashboardTotal() {
    const { data, error } = await supabase
      .from("settings")
      .select("value")
      .eq("key", "dashboard_total_amount")
      .maybeSingle();
    if (!error && data && data.value != null) {
      const el = document.getElementById("dashboardTotalAmount");
      if (el) el.textContent = String(data.value);
    } else if (error) {
      console.warn("Dashboard total settings table/policy not ready:", error.message);
    }
  }

  window.saveDashboardTotal = async function(value) {
    const amount = Number(value);
    if (!Number.isFinite(amount) || amount < 0) throw new Error("Total amount சரியாக enter pannunga.");
    const { error } = await supabase
      .from("settings")
      .upsert({ key: "dashboard_total_amount", value: String(amount) }, { onConflict: "key" });
    if (error) throw error;
    const el = document.getElementById("dashboardTotalAmount");
    if (el) el.textContent = String(amount);
  };

  loadDashboardTotal();

  function displayPaymentTime(value) {
    if (!value) return "";
    if (String(value).includes("T")) {
      const d = new Date(value);
      if (!Number.isNaN(d.getTime())) {
        return d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit", hour12: true });
      }
    }
    const raw = String(value).slice(0, 5);
    const parts = raw.split(":");
    if (parts.length === 2) {
      let h = Number(parts[0]), m = parts[1];
      const ap = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return `${h}:${m} ${ap}`;
    }
    return raw;
  }

  // Expose the same formatter to the mobile Paid Bill handler in the classic script.
  // The main script is type=module, so its local functions are not global by default.
  window.displayPaymentTime = displayPaymentTime;

  window.formatBillDate = function(value) {
    if (!value) return "";
    if (/^\d{4}-\d{2}-\d{2}$/.test(String(value))) {
      const [y,m,d] = String(value).split("-");
      return `${d}/${m}/${y}`;
    }
    return String(value);
  };

  async function loadPayments() {
    const { data, error } = await supabase
      .from("Payments")
      .select("*")
      .order("created_at", { ascending: true });

    if (error) {
      console.error(error);
      window.supabaseErrorMessage = "❌ Supabase read failed: " + error.message;
      const saved = document.getElementById("adminSaved");
      if (saved) saved.textContent = window.supabaseErrorMessage;
      return;
    }

    const grouped = {};
    (data || []).forEach(p => {
      const member = p.member_name;
      if (!member) return;
      if (!grouped[member]) grouped[member] = [];
      const rawPaymentDate = p.payment_date || "";
      const normalizedPaymentDate = /^\d{4}-\d{2}-\d{2}$/.test(String(rawPaymentDate))
        ? window.formatBillDate(rawPaymentDate)
        : String(rawPaymentDate);
      grouped[member].push({
        id: p.id,
        member: p.member_name,
        date: normalizedPaymentDate,
        time: p.payment_time || "",
        amount: String(p.payment_amount ?? ""),
        status: p.payment_status || "Paid",
        method: p.payment_method || "Online",
        image: p.payment_proof_url || ""
      });
    });

    window.cloudPayments = grouped;
    if (window.currentMember && typeof window.showMember === "function") {
      window.showMember(window.currentMember);
    }
  }

  window.savePaymentToSupabase = async function(payment, file) {
    try {
      let imageUrl = "";

      if (file) {
        const safeMember = payment.member.replace(/[^a-zA-Z0-9_-]/g, "_");
        const safeDate = payment.date.replace(/[^0-9-]/g, "_");
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
        const path = `${safeMember}/${safeDate}_${Date.now()}.${ext}`;

        const { error: uploadError } = await supabase
          .storage
          .from("Payment history")
          .upload(path, file, { upsert: false, contentType: file.type || "image/jpeg" });

        if (uploadError) throw new Error("ID upload failed: " + uploadError.message);

        const { data: publicData } = supabase
          .storage
          .from("Payment history")
          .getPublicUrl(path);

        imageUrl = publicData.publicUrl;
      }

      const { data, error } = await supabase
        .from("Payments")
        .insert([{
          member_name: payment.member,
          payment_amount: Number(payment.amount),
          payment_status: "Paid",
          payment_method: payment.method,
          payment_proof_url: imageUrl,
          payment_date: payment.date,
          payment_time: payment.time || null
        }])
        .select()
        .single();

      if (error) throw error;

      await loadPayments();
      return { ok: true, data };
    } catch (err) {
      console.error(err);
      return { ok: false, error: err.message || String(err) };
    }
  };

  loadPayments();
</script>

// Member buttons: use event delegation so clicks work reliably on GitHub Pages/mobile browsers.
document.getElementById("memberList")?.addEventListener("click", function(e){
  const btn = e.target.closest("button[data-member]");
  if (!btn) return;
  const name = btn.getAttribute("data-member");
  if (name && typeof window.showMember === "function") window.showMember(name);
});

function getAdminPayments(){
  return window.cloudPayments || {};
}

window.showMember = function(name){
  window.currentMember = name;
  const memberList = document.getElementById("memberList");
  if (memberList) memberList.style.display="none";
  document.getElementById("details").style.display="block";

  document.getElementById("memberName").innerHTML=name;
  document.getElementById("mobile").innerHTML=data[name].mobile.replace(/(\d{5})(\d{5})/, "$1 $2");

  // Scheduled history is the member's normal monthly bill schedule.
  // If Admin has saved a payment for the same member/date, that payment
  // REPLACES the scheduled row's method (Cash / UPI Bill). It is not added
  // as a second row and is not counted twice in Total Paid.
  let rows="";
  const adminPayments = getAdminPayments()[name] || [];
  const activePayments = adminPayments.filter(p => p && p.status !== "Deleted" && Number(p.amount || 0) > 0);

  const normDate = (v) => {
    const s = String(v || "").trim();
    if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
      const [y,m,d] = s.split("-");
      return `${d}/${m}/${y}`;
    }
    return s;
  };

  const paymentForDate = (date) => {
    const nd = normDate(date);
    const matches = activePayments.filter(p => normDate(p.date) === nd);
    return matches.length ? matches[matches.length - 1] : null;
  };

  let totalPaid = 0;
  const usedPaymentIds = new Set();

  data[name].history.forEach(x=>{
    const adminPayment = paymentForDate(x[0]);
    let amount = Number(x[1] || 0);
    let methodCell;

    if (adminPayment) {
      usedPaymentIds.add(String(adminPayment.id || `${adminPayment.date}|${adminPayment.amount}|${adminPayment.method}`));
      amount = Number(adminPayment.amount || x[1] || 0);
      const method = String(adminPayment.method || "Cash").toUpperCase();
      const safeName = name.replace(/'/g,"\\'");
      const safeDate = String(adminPayment.date || x[0]).replace(/'/g,"\\'");
      const safeAmount = String(adminPayment.amount || amount).replace(/'/g,"\\'");
      const idArg = adminPayment.id ? `'${String(adminPayment.id).replace(/'/g,"\\'")}'` : "null";

      // History row must always show Paid 🧾 Bill.
      // Cash / UPI is shown only inside the bill after opening it.
      methodCell = `<button class="paid-btn" type="button" onclick="return window.__openPaidBill(this);" data-open-bill="1" data-paid-name="${encodeURIComponent(name)}" data-paid-date="${encodeURIComponent(adminPayment.date || x[0])}" data-paid-amount="${encodeURIComponent(adminPayment.amount || amount)}" data-paid-id="${adminPayment.id ? String(adminPayment.id) : ""}">Paid 🧾 Bill</button>`;
      totalPaid += amount;
    } else if (x[2] === "Paid") {
      methodCell = `<button class="paid-btn" type="button" onclick="return window.__openPaidBill(this);" data-open-bill="1" data-paid-name="${encodeURIComponent(name)}" data-paid-date="${encodeURIComponent(x[0])}" data-paid-amount="${encodeURIComponent(x[1])}">Paid 🧾 Bill</button>`;
      totalPaid += amount;
    } else {
      methodCell = x[2];
    }

    rows += `<tr><td>${x[0]}</td><td>₹${amount}</td><td>${methodCell}</td></tr>`;
  });

  // Extra Admin payments are intentionally not shown here.
  // A payment only appears by replacing its matching scheduled monthly row.

  // Total Paid counts the effective monthly payment once. A Cash/UPI payment
  // replacing a Paid Bill row therefore does not create a duplicate amount.
  document.getElementById("total").innerHTML = totalPaid;

  const historyEl = document.getElementById("history");
  historyEl.innerHTML=rows;

  // IMPORTANT: attach the Paid Bill click handler directly to the rebuilt
  // history table. This avoids inline onclick issues on Android Chrome,
  // downloaded content:// pages, and module scripts.
  historyEl.onclick = function(e) {
    const btn = e.target.closest("button[data-open-bill]");
    if (!btn || !historyEl.contains(btn)) return;
    e.preventDefault();
    e.stopPropagation();

    const billName = decodeURIComponent(btn.getAttribute("data-paid-name") || "");
    const billDate = decodeURIComponent(btn.getAttribute("data-paid-date") || "");
    const billAmount = decodeURIComponent(btn.getAttribute("data-paid-amount") || "");
    const billId = btn.getAttribute("data-paid-id") || null;

    if (!billName || !billDate || !billAmount) {
      alert("Bill details கிடைக்கவில்லை.");
      return;
    }

    // Open directly inside this page; never use window.open().
    if (typeof window.openBill === "function") {
      window.openBill(billName, billDate, billAmount, billId);
    } else {
      alert("Bill system load ஆகவில்லை. Page-ஐ refresh பண்ணுங்க.");
    }
  };
}

async function saveAdminPayment(){
  const name=document.getElementById("adminMember").value;
  const date=document.getElementById("adminDate").value;
  const amount=document.getElementById("adminAmount").value;
  const method=document.getElementById("adminMethod").value;
  const file=document.getElementById("adminImage").files[0];

  if(!name || !date || !amount || Number(amount) <= 0){
    alert("Member, Date and Amount சரியாக fill pannunga.");
    return;
  }
  if(method === "UPI" && !file){
    alert("UPI payment-ku ID select pannunga.");
    document.getElementById("adminImage").focus();
    return;
  }

  const saved=document.getElementById("adminSaved");
  saved.textContent="⏳ Saving payment...";

  const time = document.getElementById("adminTime").value;
  if (!time) {
    alert("Payment Time select pannunga.");
    document.getElementById("adminTime").focus();
    return;
  }
  // Store the selected 12-hour time as a real timestamptz value.
  // Supabase public.Payments.payment_time is a timestamp with time zone.
  const paymentTime = `${date}T${time}:00+05:30`;

  const result = await window.savePaymentToSupabase({
    member:name, date, time:paymentTime, amount:String(amount), method
  }, method === "UPI" ? file : null);

  if(!result.ok){
    saved.textContent="❌ Save failed: " + result.error;
    alert("Payment save failed.\n\n" + result.error);
    return;
  }

  saved.textContent = method === "UPI"
    ? "✅ UPI payment + UPI Bill ID saved."
    : "✅ Cash payment saved. UPI ID not needed.";
  document.getElementById("adminAmount").value="";
  document.getElementById("adminTime").value="";
  document.getElementById("adminImage").value="";
  togglePaymentScreenshot();
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("Image read failed."));
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const maxSide=1000;
        const scale=Math.min(1,maxSide/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        let quality=.62;
        let data=canvas.toDataURL("image/jpeg",quality);
        for(let i=0;i<6 && data.length>900000;i++){
          quality-=.07;
          data=canvas.toDataURL("image/jpeg",quality);
        }
        if(data.length>950000) reject(new Error("Screenshot romba perusa irukku. Smaller ID select pannunga."));
        else resolve(data);
      };
      img.onerror=()=>reject(new Error("Invalid image file."));
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function normalizePaymentDate(value){
  if (!value) return "";
  const v = String(value);
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return window.formatBillDate(v);
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return v;
  return v;
}

function getMatchingPayment(name, date, amount, paymentId=null){
  const adminPayments = getAdminPayments()[name] || [];
  if (paymentId) {
    const byId = adminPayments.find(p => String(p.id) === String(paymentId));
    if (byId) return byId;
  }

  const matches = adminPayments.filter(p =>
    p.status !== "Deleted" &&
    normalizePaymentDate(p.date) === normalizePaymentDate(date) &&
    String(p.amount) === String(amount)
  );

  // Prefer the newest matching payment that actually has a saved time.
  // This fixes old rows with the same date/amount but a blank payment_time.
  for (let i = matches.length - 1; i >= 0; i--) {
    if (matches[i].time) return matches[i];
  }
  return matches.length ? matches[matches.length - 1] : null;
}

function openPaymentHistory(name, date, amount, paymentId=null){
  // Kept for compatibility with older cached buttons.
  // UPI opens the full UPI Bill directly; Cash has no extra bill action.
  const p = getMatchingPayment(name, date, amount, paymentId);
  if (!p || p.method !== "Cash") {
    window.openBill(name, date, amount, paymentId);
  }
}
function closePaymentHistory(){
  document.getElementById("paymentHistoryModal").style.display="none";
}

window.openBill = async function(name, date, amount, paymentId=null){
  try {
  // First use the already-loaded payments. If the page was opened/clicked
  // before Supabase finished loading, fetch the exact payment directly.

      .from("Payments")
      .select("id,member_name,payment_amount,payment_time,payment_status,payment_method,payment_proof_url,payment_date,created_at")
      .eq("member_name", name)
      .eq("payment_amount", Number(amount))
      .order("created_at", { ascending: false })
      .limit(1);

    if (paymentId) {
      q = supabase
        .from("Payments")
        .select("id,member_name,payment_amount,payment_time,payment_status,payment_method,payment_proof_url,payment_date,created_at")
        .eq("id", paymentId)
        .limit(1);

        ? String(date).split("/").reverse().join("-")

  ];
  const memberIndex = memberNamesForBill.indexOf(name);
  const billNo = memberIndex >= 0 ? String(memberIndex + 1).padStart(3,"0") : "000";
  const proof = matchingPayment?.image || "";

<!-- PAYMENT HISTORY MODAL -->
<div id="paymentHistoryModal" class="payment-modal" onclick="if(event.target===this) closePaymentHistory()">
  <div class="payment-modal-box">
    <button class="modal-close" onclick="closePaymentHistory()">✕</button>
    <h2 id="paymentHistoryTitle">Payment History</h2>
    <div id="paymentHistoryBody"></div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin-overlay">
  <div class="admin-box">
    <button class="admin-close" onclick="closeAdmin()">✕</button>
    <h2>🔐 Admin Payment</h2>

    <div id="adminLogin">
      <p>Admin password</p>
      <input id="adminPassword" type="password" placeholder="Password">
      <button onclick="adminLogin()">Login</button>
      <p id="adminError" class="error"></p>
    </div>

    <div id="adminForm" style="display:none">
      <div class="admin-section total-section">
        <h3>💰 Total Amount</h3>
        <label>Total Amount (manual)</label>
        <input id="adminTotalAmount" type="number" min="0" placeholder="1700">
        <button type="button" onclick="saveDashboardTotalFromAdmin()">💾 Save Total Amount</button>
        <p id="totalSaved" class="saved"></p>
      </div>

      <div class="admin-section payment-section">
        <h3>💳 Payment</h3>
        <label>Member</label>
        <select id="adminMember"></select>

        <label>Date</label>
        <input id="adminDate" type="date">

        <label>Amount</label>
        <input id="adminAmount" type="number" min="0" placeholder="100">

        <label>Payment Time (12-hour AM/PM)</label>
        <select id="adminTime"></select>

        <label>Payment Method</label>
        <select id="adminMethod" onchange="togglePaymentScreenshot()">
          <option value="Cash">Cash</option>
          <option value="UPI">UPI</option>
        </select>

        <div id="upiScreenshotWrap" style="display:none">
          <label>UPI Payment ID</label>
          <input id="adminImage" type="file" accept="image/*">
        </div>

        <button type="button" onclick="saveAdminPayment()">💾 Save Payment</button>
        <p id="adminSaved" class="saved"></p>
      </div>
    </div>
  </div>
</div>
